<!doctype html><meta charset="utf-8"><title>GPU performance comparison</title>
<body style="background:#10110f;color:#ddd;font:14px monospace"><h1>Kerr GPU performance comparison</h1><button id="run">Run paired comparison</button><canvas id="c" width="1000" height="700" style="width:500px;height:350px"></canvas><pre id="result">Ready</pre>
<script src="baseline-shaders.js"></script><script>const BEFORE=ECHO_SHADERS;</script><script src="../live/shaders.js"></script><script>const AFTER=ECHO_SHADERS;</script><script src="../live/spectra.js"></script>
<script>
const gl=document.getElementById('c').getContext('webgl2',{antialias:false});gl.getExtension('EXT_color_buffer_float');const timer=gl.getExtension('EXT_disjoint_timer_query_webgl2');
const W=1000,H=700;
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
function program(src){const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,BEFORE.vertex));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,src));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;}
function tex(w,h,half=false,data=null){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,half?gl.RGBA16F:gl.RGBA32F,w,h,0,gl.RGBA,gl.FLOAT,data);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,half?gl.LINEAR:gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,half?gl.LINEAR:gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
function target(count,half=false){const f=gl.createFramebuffer(),ts=[];gl.bindFramebuffer(gl.FRAMEBUFFER,f);for(let k=0;k<count;k++){ts.push(tex(W,H,half));gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+k,gl.TEXTURE_2D,ts[k],0);}gl.drawBuffers(ts.map((_,i)=>gl.COLOR_ATTACHMENT0+i));return {f,ts};}
function f(p,n,v){gl.uniform1f(gl.getUniformLocation(p,n),v);}function bind(p,n,t,u){gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(gl.getUniformLocation(p,n),u);}
const versions=[BEFORE,AFTER].map(s=>({trace:program(s.trace),shade:program(s.shade),post:program(s.post),sky:s.sky?program(s.sky):null}));
const map=target(2),light=target(1,true),sky=target(1,true);const a=new Float32Array(4096*4);ECHO_SPECTRA.profile.forEach((v,i)=>a[i*4]=v);const profile=tex(4096,1,false,a),b=new Float32Array(2048*4);for(let i=0;i<2048;i++)for(let c=0;c<3;c++)b[4*i+c]=ECHO_SPECTRA.euv[3*i+c];const spectra=tex(2048,1,false,b);
function trace(v,inc,field){const p=versions[v].trace;gl.useProgram(p);gl.bindFramebuffer(gl.FRAMEBUFFER,map.f);gl.viewport(0,0,W,H);gl.uniform2f(gl.getUniformLocation(p,'uSize'),W,H);f(p,'uWidth',field);f(p,'uInclination',inc*Math.PI/180);f(p,'uRoll',13*Math.PI/180);f(p,'uStep',.028);gl.drawArrays(gl.TRIANGLES,0,3);}
function background(){const p=versions[1].sky;gl.useProgram(p);gl.bindFramebuffer(gl.FRAMEBUFFER,sky.f);gl.viewport(0,0,W,H);bind(p,'uPath',map.ts[1],0);bind(p,'uSpectrum',spectra,1);f(p,'uAzimuth',0);gl.drawArrays(gl.TRIANGLES,0,3);}
function display(v){let p=versions[v].shade;gl.useProgram(p);gl.bindFramebuffer(gl.FRAMEBUFFER,light.f);gl.viewport(0,0,W,H);bind(p,'uHit',map.ts[0],0);bind(p,'uPath',map.ts[1],1);bind(p,'uProfile',profile,2);bind(p,'uSpectrum',spectra,3);bind(p,'uSky',sky.ts[0],4);f(p,'uTime',0);f(p,'uAzimuth',0);f(p,'uExposure',1.25);f(p,'uHighlight',0);f(p,'uStars',1);gl.uniform1i(gl.getUniformLocation(p,'uMode'),0);gl.drawArrays(gl.TRIANGLES,0,3);p=versions[v].post;gl.useProgram(p);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);bind(p,'uColor',light.ts[0],0);gl.uniform2f(gl.getUniformLocation(p,'uSize'),W,H);f(p,'uExposure',1.25);f(p,'uBloom',.2);gl.drawArrays(gl.TRIANGLES,0,3);}
const next=()=>new Promise(resolve=>requestAnimationFrame(resolve));
async function measure(fn){if(!timer){gl.finish();const t=performance.now();fn();gl.finish();return performance.now()-t;}const q=gl.createQuery();gl.beginQuery(timer.TIME_ELAPSED_EXT,q);fn();gl.endQuery(timer.TIME_ELAPSED_EXT);gl.flush();while(!gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE))await next();const t=gl.getParameter(timer.GPU_DISJOINT_EXT)?null:gl.getQueryParameter(q,gl.QUERY_RESULT)/1e6;gl.deleteQuery(q);return t;}
function stats(x){x=x.filter(v=>v!==null).sort((a,b)=>a-b);return {samples_ms:x,median_ms:(x[3]+x[4])/2};}
document.getElementById('run').onclick=async()=>{try{document.getElementById('run').disabled=true;const results=[];for(const [inc,field] of [[75,55],[75,16],[102,35],[15,40]]){document.getElementById('result').textContent='Measuring inclination '+inc+', field '+field;for(let v=0;v<2;v++){trace(v,inc,field);background();display(v);}gl.finish();const times=[[],[]];for(let i=0;i<8;i++)for(const v of i%2?[1,0]:[0,1])times[v].push(await measure(()=>trace(v,inc,field)));trace(1,inc,field);background();gl.finish();const displayTimes=[[],[]];for(let i=0;i<8;i++)for(const v of i%2?[1,0]:[0,1])displayTimes[v].push(await measure(()=>display(v)));results.push({inclination:inc,field,trace:times.map(stats),display:displayTimes.map(stats)});}document.getElementById('result').textContent=JSON.stringify({width:W,height:H,timing:timer?'GPU elapsed queries':'synchronized wall time',glError:gl.getError(),results});}catch(e){document.getElementById('result').textContent='ERROR: '+e.stack;}finally{document.getElementById('run').disabled=false;}};
</script>
