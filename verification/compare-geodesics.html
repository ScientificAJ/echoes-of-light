<!doctype html><meta charset="utf-8"><title>Optimized Kerr comparison</title><body style="background:#111;color:#ddd;font:14px monospace"><h1>Optimized Kerr comparison</h1><button id="run">Validate seven views</button><canvas id="c" width="128" height="80"></canvas><pre id="result">Ready</pre>
<script src="baseline-shaders.js"></script><script>const BEFORE=ECHO_SHADERS;</script><script src="../live/shaders.js"></script><script>const AFTER=ECHO_SHADERS;</script>
<script>
const gl=document.getElementById('c').getContext('webgl2');gl.getExtension('EXT_color_buffer_float');const W=128,H=80;
function compile(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x;}
const programs=[BEFORE,AFTER].map(v=>{const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,v.vertex));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,v.trace));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;});
const fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);for(let k=0;k<2;k++){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,W,H,0,gl.RGBA,gl.FLOAT,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+k,gl.TEXTURE_2D,t,0);}gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);gl.viewport(0,0,W,H);
function trace(v,inc,field){const p=programs[v];gl.useProgram(p);gl.uniform2f(gl.getUniformLocation(p,'uSize'),W,H);for(const [n,x] of [['uWidth',field],['uInclination',inc*Math.PI/180],['uRoll',13*Math.PI/180],['uStep',.028]])gl.uniform1f(gl.getUniformLocation(p,n),x);gl.drawArrays(gl.TRIANGLES,0,3);const hit=new Float32Array(W*H*4),path=new Float32Array(W*H*4);gl.readBuffer(gl.COLOR_ATTACHMENT0);gl.readPixels(0,0,W,H,gl.RGBA,gl.FLOAT,hit);gl.readBuffer(gl.COLOR_ATTACHMENT1);gl.readPixels(0,0,W,H,gl.RGBA,gl.FLOAT,path);return {hit,path};}
document.getElementById('run').onclick=()=>{const cameraSamples=[],checks=[];for(const [inc,field] of [[75,55],[75,14],[102,35],[15,40],[90,55],[5,40],[175,40]]){const a=trace(0,inc,field),b=trace(1,inc,field);let mismatches=0,orders=0,failed=0;const maxDelta=[0,0,0,0],samples=[];for(let k=0;k<W*H;k++){const i=4*k;if(a.path[i]!==b.path[i])mismatches++;if(b.path[i]<0)failed++;if(a.path[i]===1&&b.path[i]===1){if(a.path[i+1]!==b.path[i+1])orders++;for(let c=0;c<4;c++){let d=b.hit[i+c]-a.hit[i+c];if(c===1)d=Math.atan2(Math.sin(d),Math.cos(d));maxDelta[c]=Math.max(maxDelta[c],Math.abs(d));}}if(k%37===0)samples.push({x:k%W,y:Math.floor(k/W),hit:Array.from(b.hit.slice(i,i+4)),path:Array.from(b.path.slice(i,i+4))});}checks.push({inclination:inc,field,grid_rays:W*H,classification_mismatches:mismatches,disk_order_mismatches:orders,unresolved:failed,max_disk_delta_r_phi_t_g:maxDelta});cameraSamples.push({width:W,height:H,inclination:inc,field,step:.028,failed,glError:gl.getError(),samples});}document.getElementById('result').textContent=JSON.stringify({checks,cameraSamples});};
</script>
